[project]
name = "retail-bot-platform"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot>=21.0",
    "python-dotenv",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-cov",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["F", "E", "I"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing"
filterwarnings = [
    "ignore::telegram.warnings.PTBUserWarning",
    # pytest-mock emits RuntimeWarning when MagicMock.raise_for_status
    # triggers an async mock that is never awaited. The exception is
    # caught synchronously by httpx.HTTPError handlers — benign.
    'ignore:coroutine .* was never awaited:RuntimeWarning',
]

[tool.setuptools]
packages = ["handlers"]
py-modules = ["main"]
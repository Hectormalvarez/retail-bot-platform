services:
  bot:
    build:
      context: ./bot
    container_name: retail_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./bot:/app
      - bot_state:/app/data
    networks:
      - retail_mesh
    depends_on:
      - db

  api:
    build:
      context: ./api
    container_name: retail_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./api:/app
    networks:
      - retail_mesh
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: retail_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - retail_mesh

networks:
  retail_mesh:
    driver: bridge

volumes:
  postgres_data:
  bot_state: